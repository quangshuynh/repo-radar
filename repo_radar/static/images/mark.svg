<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Repo Radar mark: two range rings, one sweep, one detected signal. Doubles as the favicon. -->
  <g id="mark" fill="none" stroke-linecap="round">
    <circle cx="12" cy="12" r="9.5" stroke-width="1.5" style="stroke: var(--mark-ink, #eeebe7); stroke-opacity: 0.4"/>
    <circle cx="12" cy="12" r="5" stroke-width="1.5" style="stroke: var(--mark-ink, #eeebe7); stroke-opacity: 0.7"/>
    <path d="M12 12 18.72 5.28" stroke-width="1.75" style="stroke: var(--mark-accent, #ef6c2b)"/>
    <circle cx="12" cy="12" r="1.4" style="fill: var(--mark-ink, #eeebe7)"/>
    <circle cx="16.3" cy="13.9" r="1.6" style="fill: var(--mark-accent, #ef6c2b)"/>
  </g>
</svg>
