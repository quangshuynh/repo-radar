<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Radar</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Repo Radar</strong><span>local repository discovery</span></div>
    <nav><a href="#discover">Discover</a><a href="#profile">Profile</a><a href="#preferences">Preferences</a></nav>
  </header>
  <main>
    <p id="message" class="message" role="status"></p>
    <section id="status" class="panel compact"><h2>Status</h2><div id="status-content">Loading local state...</div><button id="sync">Sync starred repositories</button></section>
    <section id="discover" class="panel">
      <div class="section-heading"><div><p class="eyebrow">Personalized results</p><h1>Discover repositories</h1></div><button id="refresh">Refresh recommendations</button></div>
      <div class="filters"><label>Language<input id="filter-language" placeholder="Python"></label><label>Minimum stars<input id="filter-min" type="number" min="0" value="0"></label><label>Maximum stars<input id="filter-max" type="number" min="0"></label><label>Results<input id="filter-limit" type="number" min="1" max="50" value="10"></label><label class="checkbox"><input id="filter-gems" type="checkbox"> Hidden gems</label></div>
      <div id="recommendations" class="cards"><p class="empty">Choose refresh to generate recommendations</p></div>
    </section>
    <section id="profile" class="panel"><div class="section-heading"><div><p class="eyebrow">Transparent signals</p><h2>Preference profile</h2></div><button id="reload-profile" class="secondary">Reload profile</button></div><div id="profile-summary"></div></section>
    <section id="preferences" class="panel">
      <p class="eyebrow">Cold start</p><h2>Build your starting profile</h2>
      <form id="import-form" class="inline-form"><label>GitHub username<input id="import-username" required placeholder="quangshuynh"></label><button>Import from GitProfileLens</button></form>
      <hr>
      <form id="preferences-form"><label>Languages<input id="languages" placeholder="Python, TypeScript"></label><label>Topics<input id="topics" placeholder="developer-tools, backend, automation"></label><label>Keywords<input id="keywords" placeholder="cli, api, productivity"></label><button>Save preferences</button></form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
